name: Chromatic Visual Regression

# Run on every PR and on pushes to main so baselines stay current.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  chromatic:
    name: Capture visual snapshots
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required for Chromatic to detect which commits
          # introduced visual changes and to build accurate baselines.
          fetch-depth: 0

      # ── Node setup ─────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ── Install dependencies ────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Build Storybook ─────────────────────────────────────────
      # Building locally and handing the static bundle to Chromatic is faster
      # than letting Chromatic build it, and gives clearer build-vs-visual
      # failure separation.
      - name: Build Storybook
        run: npm run build-storybook
        env:
          # Storybook telemetry off in CI
          STORYBOOK_DISABLE_TELEMETRY: "1"

      # ── Publish to Chromatic ────────────────────────────────────
      - name: Publish to Chromatic
        uses: chromaui/action@v11
        with:
          # CHROMATIC_PROJECT_TOKEN must be set in repo Settings → Secrets
          # (Settings → Secrets and variables → Actions → New repository secret)
          # Name:  CHROMATIC_PROJECT_TOKEN
          # Value: the token from https://www.chromatic.com/manage → project settings
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

          # Hand off the pre-built static bundle
          storybookBuildDir: frontend/storybook-static

          # Exit with a non-zero code when there are unreviewed visual diffs
          # on pull requests. Pushes to main are auto-accepted as the new baseline.
          exitOnceUploaded: false
          exitZeroOnChanges: ${{ github.event_name == 'push' }}

          # Only re-snapshot stories whose source files changed. Speeds up CI
          # considerably once the baseline is established.
          onlyChanged: true

          # Keep Chromatic from triggering its own npm install / build since we
          # already built above.
          skip: false

        env:
          # Disable Chromatic's internal telemetry
          CHROMATIC_DISABLE_LOGGING: "false"
