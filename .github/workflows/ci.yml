name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md is updated
        run: |
          if ! git diff --name-only origin/main...HEAD | grep -q '^CHANGELOG.md$'; then
            echo "❌ CHANGELOG.md was not updated. Add an entry under [Unreleased] before merging."
            exit 1
          fi
          echo "✅ CHANGELOG.md updated."

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      ADMIN_TOKEN: test-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Run OpenAPI contract tests
        run: npm run test:contract
      - name: Build
        run: npm run build

      - name: Verify build artifact is importable
        run: node -e "require('./dist/index.js'); console.log('artifact OK')"

  notify-on-failure:
    name: Slack — CI failed
    needs: [ci]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'failure'
    uses: ./.github/workflows/notify-slack.yml
    secrets: inherit
    with:
      workflow_name: "Backend CI"
      status: "failure"
      commit_sha: ${{ github.sha }}
      actor: ${{ github.actor }}
      commit_message: ${{ github.event.head_commit.message }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-on-restored:
    name: Slack — CI restored
    needs: [ci]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success'
    uses: ./.github/workflows/notify-slack.yml
    secrets: inherit
    with:
      workflow_name: "Backend CI"
      status: "success"
      commit_sha: ${{ github.sha }}
      actor: ${{ github.actor }}
      commit_message: ${{ github.event.head_commit.message }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
