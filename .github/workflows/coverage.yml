name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend — Jest + Istanbul (Node API + unit tests) ───────────────────
  # Uses the existing Jest config (jest.config.js) which runs tests/unit and
  # tests/api against src/. Coverage thresholds: 80% line/function/branch.
  backend-coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      ADMIN_TOKEN: test-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run Jest backend coverage
        # Runs all Jest test suites (unit + API) against src/.
        # Output: coverage/lcov.info  (controlled by jest.config.js)
        run: npm run coverage:backend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: backend
          # fail_ci_if_error=false: Codecov outages must not block deploys.
          # Threshold enforcement is handled by codecov.yml status checks.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Frontend — Vitest + Istanbul + jsdom ────────────────────────────────
  # Runs inside frontend/ with its own vitest.config.ts.
  # Coverage threshold: 75%. Output: frontend/coverage/lcov.info.
  frontend-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest frontend coverage
        # jsdom environment, Istanbul provider.
        # Output: frontend/coverage/lcov.info
        working-directory: frontend
        run: npm run coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Contract — Rust + cargo-llvm-cov ────────────────────────────────────
  # Targets the library crate (Soroban contract) with testutils feature.
  # Coverage threshold: 90% enforced via codecov.yml status checks.
  contract-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + llvm-tools
        run: |
          rustup update stable
          rustup component add llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-llvm-cov-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run contract coverage
        # --lib targets the library crate only (excludes fuzz targets).
        # Excludes test helpers (src/test.rs) from the report.
        # Output: coverage/contract/lcov.info
        run: |
          mkdir -p coverage/contract
          cargo llvm-cov \
            --lib \
            --features testutils \
            --lcov \
            --output-path ./coverage/contract/lcov.info \
            --ignore-filename-regex "(src/test\.rs|fuzz/)"

      - name: Upload contract coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/contract/lcov.info
          flags: contract
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
