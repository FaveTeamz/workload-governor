name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: TypeScript / Node.js ──────────────────────────────────────────
  coverage-backend:
    name: Backend Coverage (V8 / Istanbul)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage
        run: npx vitest run --config vitest.config.ts --coverage

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/backend/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: true
          verbose: true

  # ── Frontend: React / jsdom ────────────────────────────────────────────────
  coverage-frontend:
    name: Frontend Coverage (Istanbul / jsdom)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: npx vitest run --config frontend/vitest.config.ts --coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/frontend/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: true
          verbose: true

  # ── Contract: Rust / cargo-llvm-cov ───────────────────────────────────────
  coverage-contract:
    name: Contract Coverage (llvm-cov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-llvm-

      - name: Run contract tests with llvm-cov
        run: |
          cargo llvm-cov \
            --features testutils \
            --lcov \
            --output-path coverage/contract/lcov.info

      - name: Upload contract coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/contract/lcov.info
          flags: contract
          name: contract
          fail_ci_if_error: true
          verbose: true
