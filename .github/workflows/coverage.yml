name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend — Vitest + Istanbul/V8 (Node API + unit tests) ─────────────
  backend-coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      ADMIN_TOKEN: test-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run Vitest backend coverage
        # Runs only the backend project defined in vitest.config.ts (Istanbul/V8 provider).
        # Output is written to coverage/backend/lcov.info.
        run: npm run coverage:backend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Frontend — Vitest + Istanbul + jsdom ───────────────────────────────
  frontend-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest frontend coverage
        # Runs vitest inside frontend/ with jsdom environment and Istanbul provider.
        # Output is written to frontend/coverage/lcov.info.
        run: |
          cd frontend
          npm run coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Contract — Rust + cargo-llvm-cov ──────────────────────────────────
  contract-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-tools-preview for cargo-llvm-cov
        run: rustup component add llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-llvm-cov-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run contract coverage
        # Generates an LCOV report; excludes test helpers and benchmark-only code.
        # Minimum 90% line coverage enforced here to give early local feedback.
        run: |
          cargo llvm-cov \
            --features testutils \
            --lcov \
            --output-path ./coverage/contract/lcov.info \
            --ignore-filename-regex "(src/test\.rs|fuzz/)" \
            --fail-under-lines 90

      - name: Upload contract coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/contract/lcov.info
          flags: contract
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
