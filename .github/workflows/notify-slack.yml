name: Notify Slack

on:
  workflow_call:
    inputs:
      workflow_name:
        description: "Human-readable name of the calling workflow"
        required: true
        type: string
      status:
        description: "Build status: 'failure' or 'success'"
        required: true
        type: string
      commit_sha:
        description: "Full commit SHA"
        required: true
        type: string
      actor:
        description: "GitHub username who triggered the run"
        required: true
        type: string
      commit_message:
        description: "First line of the commit message"
        required: true
        type: string
      run_url:
        description: "URL to the failing/passing Actions run"
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Post Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        shell: bash
        env:
          INPUT_WORKFLOW_NAME: ${{ inputs.workflow_name }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_ACTOR: ${{ inputs.actor }}
          INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
          INPUT_RUN_URL: ${{ inputs.run_url }}
        run: |
          SHORT_SHA="${INPUT_COMMIT_SHA:0:7}"

          if [ "$INPUT_STATUS" = "failure" ]; then
            COLOR="danger"
            EMOJI=":x:"
            TEXT="${EMOJI} *${INPUT_WORKFLOW_NAME}* failed on \`main\`"
          else
            COLOR="good"
            EMOJI=":white_check_mark:"
            TEXT="${EMOJI} *${INPUT_WORKFLOW_NAME}* is green again on \`main\`"
          fi

          PAYLOAD=$(jq -n \
            --arg text "$TEXT" \
            --arg color "$COLOR" \
            --arg sha  "$SHORT_SHA" \
            --arg run_url "$INPUT_RUN_URL" \
            --arg actor "$INPUT_ACTOR" \
            --arg msg "$INPUT_COMMIT_MESSAGE" \
            '{
              attachments: [{
                color:    $color,
                fallback: $text,
                text:     $text,
                fields: [
                  { title: "Commit",  value: ("<\($run_url)|\($sha)>"), short: true },
                  { title: "Author",  value: $actor,                    short: true },
                  { title: "Message", value: $msg,                      short: false }
                ],
                footer: "GitHub Actions",
                ts: now | floor
              }]
            }')

          curl --silent --show-error --fail \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
