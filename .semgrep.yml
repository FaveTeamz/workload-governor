# .semgrep.yml — Project-specific Semgrep configuration
#
# This file is passed to `semgrep ci --config .semgrep.yml` alongside the
# shared rule packs (p/rust, p/typescript, p/nodejs).
#
# Sections:
#   rules     — project-specific custom rules
#   suppressions — known false positives with documented justification

rules:
  # ── Custom rule: Detect hardcoded secrets in TypeScript/JS ──────────────────
  - id: no-hardcoded-secrets-ts
    patterns:
      - pattern: |
          const $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(secret|password|token|api_key|apikey|private_key|auth)
      - metavariable-regex:
          metavariable: $VAR
          # Allow empty strings and obvious placeholders
          regex-not: (?i)(example|placeholder|test|dummy|fake|your_)
    message: >
      Potential hardcoded secret in variable '$VAR'. Use environment variables
      or AWS Secrets Manager instead.
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.test.js"
        - "**/*.spec.ts"
        - "**/tests/**"
        - "**/test/**"
        - "**/__tests__/**"

  # ── Custom rule: Detect console.log in production TypeScript ────────────────
  - id: no-console-log-production
    pattern: console.log(...)
    message: >
      Use the structured logger (pino/logger) instead of console.log in
      production code. console.log bypasses log level filtering.
    languages: [typescript, javascript]
    severity: WARNING
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.test.js"
        - "**/tests/**"
        - "**/scripts/**"
        - "frontend/**"

  # ── Custom rule: Detect SQL string concatenation (injection risk) ────────────
  - id: no-sql-string-concat
    patterns:
      - pattern: |
          $POOL.query($QUERY + $VAR)
      - pattern: |
          $POOL.query(`...${$VAR}...`)
    message: >
      Potential SQL injection: user-controlled value concatenated into query string.
      Use parameterized queries: pool.query('SELECT ...', [param]).
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/tests/**"

  # ── Custom rule: Knex raw() with template-literal interpolation ─────────────
  #
  # Flags calls to knex.raw() or db.raw() whose first argument is a template
  # literal that contains a ${...} interpolation.  String-literal arguments
  # and parameterised bindings (db.raw('... ?', [val])) are safe and are NOT
  # flagged.
  #
  # Safe alternatives:
  #   db.raw('SELECT * FROM issues WHERE id = ?', [id])       -- positional
  #   db.raw('SELECT * FROM issues WHERE id = :id', { id })   -- named
  #
  # The two pattern-either arms cover all interpolation positions:
  #   arm 1: `prefix${X}suffix`   (interpolation in the middle or at the end)
  #   arm 2: `prefix${X}`         (trailing interpolation, no suffix text)
  #
  # References:
  #   https://knexjs.org/guide/raw.html#raw-parameter-binding
  #   CWE-89: Improper Neutralisation of Special Elements in SQL Commands
  - id: workload-governor.knex-no-raw-interpolation
    pattern-either:
      - pattern: $OBJ.raw(`$A${$X}$B`)
      - pattern: $OBJ.raw(`$A${$X}`)
    message: >
      Knex raw() called with a template-literal containing an interpolated
      variable '$X'. This bypasses Knex's parameterisation and may allow SQL
      injection if '$X' is user-controlled.

      Use parameterised bindings instead:
        db.raw('SELECT ... WHERE col = ?', [$X])
        db.raw('SELECT ... WHERE col = :val', { val: $X })
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-89"
      confidence: HIGH
      category: security
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.test.js"
        - "**/*.spec.ts"
        - "**/tests/**"
        - "**/test/**"
        - "**/__tests__/**"

  # ── Custom rule: XDR base64 deserialization without size guard ───────────────
  #
  # Flags calls to .fromXDR(expr, 'base64') that are not preceded by a size /
  # length check on the input.  Parsing arbitrarily large XDR blobs can cause
  # excessive memory consumption or CPU exhaustion (DoS).
  #
  # Recognised safe guards (pattern-not-inside):
  #   if (input.length > MAX)  { throw ... }       -- string-char length
  #   if (input.length >= MAX) { throw ... }
  #   if (Buffer.from(input, 'base64').length > MAX)  { throw ... }  -- byte length
  #   if (Buffer.from(input, 'base64').length >= MAX) { throw ... }
  #
  # Safe example:
  #   const MAX_XDR_BYTES = 65536;
  #   if (xdrB64.length > MAX_XDR_BYTES) throw new Error('XDR payload too large');
  #   const tx = xdr.TransactionEnvelope.fromXDR(xdrB64, 'base64');
  #
  # References:
  #   CWE-400: Uncontrolled Resource Consumption
  #   Stellar XDR: https://developers.stellar.org/docs/encyclopedia/xdr
  - id: workload-governor.stellar-xdr-size-check
    patterns:
      - pattern: $OBJ.fromXDR($DATA, "base64")
      - pattern-not-inside: |
          if ($DATA.length > $SIZE) { ... }
          $OBJ.fromXDR($DATA, "base64")
      - pattern-not-inside: |
          if ($DATA.length >= $SIZE) { ... }
          $OBJ.fromXDR($DATA, "base64")
      - pattern-not-inside: |
          if (Buffer.from($DATA, "base64").length > $SIZE) { ... }
          $OBJ.fromXDR($DATA, "base64")
      - pattern-not-inside: |
          if (Buffer.from($DATA, "base64").length >= $SIZE) { ... }
          $OBJ.fromXDR($DATA, "base64")
    message: >
      XDR deserialization of '$DATA' performed without a prior size/length check.
      An attacker supplying an oversized base64 payload can cause excessive memory
      consumption or CPU exhaustion (DoS).

      Add a guard before deserializing:
        const MAX_XDR_BYTES = 65_536; // 64 KB
        if ($DATA.length > MAX_XDR_BYTES) throw new Error('XDR payload too large');
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-400"
      confidence: HIGH
      category: security
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.test.js"
        - "**/*.spec.ts"
        - "**/tests/**"
        - "**/test/**"
        - "**/__tests__/**"


# ── Suppressions for known false positives ─────────────────────────────────────
#
# Format:
#   <rule-id>: <file-or-glob>
#     reason: <explanation>
#     added:  <YYYY-MM-DD>
#     ticket: <issue or PR reference>
#
# To suppress inline, add a comment on the finding line:
#   // nosemgrep: <rule-id>
#
# Suppressions here apply path-level; inline nosemgrep takes precedence.

suppressions:

  # p/typescript detects `process.env.X || "default"` as a potential hardcoded
  # secret when the default is an obviously safe development placeholder.
  # The pattern fires on src/horizon.ts:
  #   const HORIZON_URL = process.env.HORIZON_URL ?? "https://horizon-testnet.stellar.org"
  # The testnet URL is a public, non-sensitive endpoint.
  typescript.lang.security.audit.hardcoded-credentials:
    - path: src/horizon.ts
      reason: >
        HORIZON_URL default is the public Stellar testnet URL, not a secret.
        No credential is exposed.
      added: "2026-08-29"
      ticket: "#638"

  # p/nodejs flags `new Redis(REDIS_URL)` as a potential SSRF vector.
  # The REDIS_URL comes from an environment variable set via AWS Secrets Manager,
  # never from user input.
  javascript.lang.security.audit.ssrf:
    - path: backend/src/health.ts
      reason: >
        Redis URL is sourced from process.env.REDIS_URL (Secrets Manager), not
        user-controlled input. Not an SSRF vector.
      added: "2026-08-29"
      ticket: "#638"
    - path: src/services/redis.ts
      reason: Same as above — Redis URL is env-controlled, not user-controlled.
      added: "2026-08-29"
      ticket: "#638"
