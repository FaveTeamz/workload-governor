# codecov.yml
# Codecov configuration for WorkloadGovernor
# Docs: https://docs.codecov.com/docs/codecov-yaml

coverage:
  # Overall project threshold — weighted average of all flags
  status:
    project:
      default:
        target: 80%
        threshold: 2%   # allow up to 2% drop before failing
        if_not_found: success
        if_ci_failed: error

    # Per-flag patch coverage (only lines changed in the PR)
    patch:
      default:
        target: 70%
        threshold: 5%

# ── Flags ─────────────────────────────────────────────────────────────────────
# Each flag maps to a separate upload in .github/workflows/coverage.yml

flag_management:
  default_rules:
    carryforward: true   # use last good upload when a flag is not uploaded in a run

flags:
  backend:
    paths:
      - src/
    carryforward: true
    # Minimum coverage threshold enforced as a PR check
    coverage:
      status:
        project:
          default:
            target: 80%
            threshold: 2%
        patch:
          default:
            target: 70%

  frontend:
    paths:
      - frontend/src/
    carryforward: true
    coverage:
      status:
        project:
          default:
            target: 75%
            threshold: 2%
        patch:
          default:
            target: 65%

  contract:
    paths:
      - src/          # Rust source lives in src/ for the Soroban contract
    carryforward: true
    coverage:
      status:
        project:
          default:
            target: 90%
            threshold: 1%
        patch:
          default:
            target: 80%

# ── PR Comment ────────────────────────────────────────────────────────────────

comment:
  layout: "reach,diff,flags,tree,betaprofiling"
  behavior: default        # update existing comment rather than creating a new one
  require_changes: true    # only comment when coverage changes
  require_base: true       # require base commit coverage to compute delta
  show_carryforward_flags: true
  hide_project_coverage: false

# ── Ignore paths ──────────────────────────────────────────────────────────────

ignore:
  - "tests/**"
  - "infra/**"
  - "docs/**"
  - "**/*.md"
  - "dist/**"
  - "coverage/**"
  - "node_modules/**"
  - "target/**"
