[package]
name = "contracts"
version = "0.1.0"
edition = "2021"
publish = false

# This crate re-exports the canonical WorkloadGovernor contract defined in the
# workspace root crate (`workload-governor`).  It exists so that external
# tooling (Stellar CLI, integration scripts) can reference a dedicated
# `contracts/` package without duplicating or diverging from the implementation.

[lib]
name = "workload_governor_contracts"
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = [
    "soroban-sdk/testutils",
    "workload-governor/testutils",
]

[dependencies]
soroban-sdk = { version = "22.0.0", features = [] }
workload-governor = { path = "..", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
workload-governor = { path = "..", features = ["testutils"] }
