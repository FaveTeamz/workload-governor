<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <!-- Clipboard body -->
  <rect x="52" y="38" width="96" height="104" rx="8" stroke="currentColor" stroke-width="2.5" fill="none" opacity="0.15"/>
  <rect x="52" y="38" width="96" height="104" rx="8" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Clipboard clip at top -->
  <rect x="80" y="30" width="40" height="18" rx="5" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Empty lines on clipboard -->
  <line x1="70" y1="76" x2="130" y2="76" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="70" y1="92" x2="115" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="70" y1="108" x2="120" y2="108" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Empty checkbox marks -->
  <rect x="70" y="72" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
  <rect x="70" y="88" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
  <rect x="70" y="104" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Magnifying glass handle -->
  <circle cx="148" cy="115" r="16" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <line x1="159" y1="126" x2="170" y2="137" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner magnifying glass -->
  <circle cx="148" cy="115" r="9" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
