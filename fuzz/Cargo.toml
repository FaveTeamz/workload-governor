[package]
name = "workload-governor-fuzz"
version = "0.1.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.7"
# soroban-sdk 22.0.0 requires arbitrary ~1.3; use 1.3.2 to stay in range.
arbitrary = { version = "1.3.2", features = ["derive"] }

# Pull in the contract with testutils enabled so we can use the test env
workload-governor = { path = "..", features = ["testutils"] }
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

# ── Dependency pins ───────────────────────────────────────────────────────────
# soroban-env-host 22.x declares `ed25519-dalek = ">=2.0.0"` which resolves to
# 3.0.0 under a fresh resolution. However its testutils.rs calls
# `SigningKey::generate(chacha)` with a rand_core-0.6 ChaCha20Rng, which is
# incompatible with ed25519-dalek 3's rand_core-0.10 CryptoRng bound.
# Pinning to 2.2.0 (the last 2.x release) restores the working combination.
ed25519-dalek = "=2.2.0"

[[bin]]
name = "apply_for_issue"
path = "fuzz_targets/apply_for_issue.rs"
test = false
doc = false

[[bin]]
name = "fuzz_batch_apply"
path = "fuzz_targets/fuzz_batch_apply.rs"
test = false
doc = false

# ── Profile overrides ─────────────────────────────────────────────────────────
# The workspace root sets panic = "abort" for the release profile (required for
# WASM contracts to fit within the 64 KB size limit).  Fuzz targets MUST use
# panic = "unwind" so that the Soroban test-environment's panic_with_error!
# macro can be caught by the try_* client methods rather than aborting the
# process (SIGABRT), which libFuzzer would misreport as a crash.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"