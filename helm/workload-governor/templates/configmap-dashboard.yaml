{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workload-governor.fullname" . }}-dashboard-overview
  labels:
    {{- include "workload-governor.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  workload-governor-overview.json: |-
{{ .Files.Get "dashboards/workload-governor-overview.json" | indent 4 }}
{{- end }}
