{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vesting-backend.fullname" . }}-secrets
  labels:
    {{- include "vesting-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | default .Values.externalSecrets.secretStoreName | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ include "vesting-backend.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef.key | default $.Values.externalSecrets.remoteKey | quote }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property | quote }}
        {{- end }}
    {{- end }}
{{- end }}
