{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vesting-backend.fullname" . }}-secrets
  labels:
    {{- include "vesting-backend.labels" . | nindent 4 }}
type: Opaque
{{- if or .Values.secrets.databasePassword .Values.secrets.adminSecretKey .Values.secrets.githubWebhookSecret }}
stringData:
  {{- if .Values.secrets.databasePassword }}
  DATABASE_URL: {{ .Values.secrets.databasePassword | quote }}
  {{- end }}
  {{- if .Values.secrets.adminSecretKey }}
  ADMIN_SECRET_KEY: {{ .Values.secrets.adminSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  {{- end }}
{{- end }}
{{- end }}
