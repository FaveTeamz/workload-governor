groups:
  - name: indexer
    rules:
      - alert: IndexerLagCritical
        expr: indexer_ledger_lag > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Event indexer is critically behind the Stellar network"
          description: "The event indexer has been more than 50 ledgers behind for over 5 minutes."
  - name: database
    rules:
      - alert: DatabasePoolWaitingRequestsHigh
        expr: pg_pool_waiting_requests > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool has high waiting requests"
          description: "{{ $value }} requests have been waiting for more than one minute."
  - name: http-latency
    rules:
      - alert: HighHttpLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 HTTP request latency exceeds 500 ms"
          description: "P95 request latency exceeded 500 ms for five minutes."

  - name: workload-governor-contract
    rules:
      - alert: ApplicationTtlNearExpiration
        expr: contract_min_application_remaining_ledgers < 2000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Application TTL near expiration"
          description: "Minimum remaining application entry TTL is {{ $value }} ledgers (< 2000 ledgers / ~2.5 hours remaining). Extend TTL immediately to prevent state eviction."

  - name: github-webhooks
    rules:
      - alert: WebhookSignatureFailureRateHigh
        expr: (sum(rate(github_webhooks_received_total{status="invalid_signature"}[5m])) / sum(rate(github_webhooks_received_total[5m]))) > 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High GitHub webhook signature failure rate detected"
          description: "GitHub webhook signature failure rate exceeds 10% of total webhook deliveries over a 5-minute window (current: {{ $value | humanizePercentage }}). Verify GITHUB_WEBHOOK_SECRET and webhook configuration."

      - alert: WebhookProcessingErrorRateHigh
        expr: (sum(rate(github_webhooks_received_total{status="error"}[5m])) / sum(rate(github_webhooks_received_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GitHub webhook processing error rate detected"
          description: "GitHub webhook processing error rate exceeds 5% of total webhook deliveries over a 5-minute window (current: {{ $value | humanizePercentage }})."
