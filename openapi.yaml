openapi: '3.0.3'
info:
  title: WorkloadGovernor API
  version: '1.0.0'
  description: >
    REST API for the WorkloadGovernor contributor platform. Provides org management,
    issue tracking, assignment routing, and event history backed by the
    Soroban smart contract on the Stellar network.
  contact:
    name: FaveTeamz
    url: https://github.com/FaveTeamz/workload-governor
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:3001
    description: Local development server
  - url: https://api.workload-governor.example.com
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: health
    description: Service health checks
  - name: orgs
    description: Registered organizations
  - name: issues
    description: Open issues within an org
  - name: assignments
    description: Active issue assignments
  - name: events
    description: On-chain event history
  - name: contributors
    description: Contributor statistics
  - name: audit
    description: Cancellation and activity audit log
  - name: admin
    description: Admin-only diagnostic and consistency operations
  - name: transactions
    description: XDR transaction building and verification

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List registered organizations
      responses:
        '200':
          description: List of registered orgs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Org'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /orgs/{orgId}/issues:
    get:
      operationId: listOrgIssues
      tags: [issues]
      summary: List open issues for an org
      parameters:
        - $ref: '#/components/parameters/orgId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of open issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: bulkRegisterIssues
      tags: [issues]
      summary: Bulk register multiple issues for an org
      description: >
        Register multiple issues in a single transaction. All issues are registered
        atomically; if any registration fails, all are rolled back. Maximum 100
        issues per request. Returns a detailed report of successes and failures.
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRegisterIssuesRequest'
      responses:
        '201':
          description: Issues registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRegistrationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /orgs/{orgId}/applications:
    get:
      operationId: listOrgApplications
      tags: [orgs]
      summary: List pending applications for an org
      description: >
        Returns all pending applications for a given org aggregated from on-chain
        state via Soroban RPC. Results are cached in Redis with a 30-second TTL.
      parameters:
        - $ref: '#/components/parameters/orgId'
        - name: page
          in: query
          description: 1-based page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Results per page (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Paginated list of pending applications
          headers:
            X-Cache:
              description: HIT when served from Redis cache, MISS otherwise
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /orgs/{orgId}/assignments:
    get:
      operationId: listOrgAssignments
      tags: [assignments]
      summary: List active assignments for an org
      parameters:
        - $ref: '#/components/parameters/orgId'
        - name: contributor
          in: query
          description: Filter by contributor address
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of active assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /orgs/{orgId}/issues/{issueId}/apply:
    post:
      operationId: applyForIssue
      tags: [issues]
      summary: Apply for an open issue
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/issueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: withdrawApplication
      tags: [issues]
      summary: Withdraw an application for an issue
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/issueId'
        - name: contributor
          in: query
          required: true
          schema:
            type: string
          description: Contributor address withdrawing the application
      responses:
        '204':
          description: Application withdrawn successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /orgs/{orgId}/events:
    get:
      operationId: listOrgEvents
      tags: [events]
      summary: List on-chain events for an org
      parameters:
        - $ref: '#/components/parameters/orgId'
        - name: contributor
          in: query
          description: Filter by contributor address
          schema:
            type: string
        - name: event_type
          in: query
          description: Filter by event type
          schema:
            type: string
            enum: [applied, withdrawn, assigned, completed, revoked]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /contributors/{address}/stats:
    get:
      operationId: getContributorStats
      tags: [contributors]
      summary: Get global stats for a contributor
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Contributor Stellar address
      responses:
        '200':
          description: Contributor statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /contributors/{address}/summary:
    get:
      operationId: getContributorSummary
      tags: [contributors]
      summary: Get full aggregated profile for a contributor
      description: >
        Returns the contributor's address, global application count,
        global assignment count, per-org breakdown, and the last 50
        on-chain events. Returns 404 when the contributor has no recorded
        on-chain activity.
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Stellar public key (G…) of the contributor
      responses:
        '200':
          description: Full contributor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit:
    get:
      operationId: getAuditCancellations
      tags: [audit]
      summary: Get paginated cancellation audit records
      description: >
        Returns a paginated list of assignment cancellation / revocation
        events for monitoring and compliance purposes. Admin users may
        omit `org_id` to fetch across all organisations.
      parameters:
        - name: org_id
          in: query
          description: Filter records to a specific organisation (required for non-admin callers)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPaginatedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/consistency:
    get:
      operationId: getConsistency
      tags: [admin]
      summary: Check on-chain counter consistency
      description: >
        Invokes the contract's `check_consistency` function with a supplied list
        of `(contributor, org_id)` pairs and issue IDs, and returns any pairs
        where the stored org assignment counter disagrees with the live assignment
        sentinels. Used to detect storage corruption after migrations.
      parameters:
        - name: pairs
          in: query
          required: true
          description: >
            JSON-encoded array of `[address, org_id]` pairs to probe.
            Example: `[["GABC...","my_org"]]`
          schema:
            type: string
        - name: issue_ids
          in: query
          required: true
          description: >
            Comma-separated list of issue IDs to probe per pair.
            Example: `1,2,3,42`
          schema:
            type: string
      responses:
        '200':
          description: List of inconsistent pairs (empty when all consistent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/consistency/remediate:
    post:
      operationId: postConsistencyRemediate
      tags: [admin]
      summary: Remediate detected counter inconsistencies
      description: >
        Accepts the output of `GET /api/admin/consistency` and attempts to
        correct each inconsistent pair by rebuilding the org assignment counter
        from live assignment sentinels. **Requires admin authentication.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediateRequest'
      responses:
        '200':
          description: Remediation results per pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /verify-xdr:
    post:
      operationId: verifyXdr
      tags: [transactions]
      summary: Verify a signed Stellar XDR transaction
      description: >
        Validates a base64-encoded signed Stellar XDR transaction envelope without
        submitting it to the network. Checks that:

          1. The XDR is well-formed.
          2. The transaction targets the configured contract ID.
          3. `timeBounds` have not expired.
          4. At least one signature matches the contributor address embedded in
             the first operation argument.

        Returns `ok: true` with `signerAddress` and `contractId` on success,
        or `ok: false` with a `reason` code on failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyXdrRequest'
      responses:
        '200':
          description: Verification result (check `ok` field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyXdrResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /orgs/{orgId}/cap:
    get:
      operationId: getOrgCap
      tags: [orgs]
      summary: Get the per-org assignment cap
      description: >
        Returns the effective assignment cap for the organisation. Returns the
        per-org override if one has been set via `PUT /api/orgs/{orgId}/cap`,
        otherwise returns the platform default of `4`.
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Current org cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgCapResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: setOrgCap
      tags: [orgs]
      summary: Set the per-org assignment cap (maintainer-only)
      description: >
        Overrides the org-level assignment cap. The cap must be in the range
        `[1, 20]` inclusive. The change takes effect immediately on the next
        `assign_issue` call for this org.

        Requires a valid maintainer signature in the `Authorization` header.
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOrgCapRequest'
      responses:
        '200':
          description: Cap updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgCapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
      description: Organization identifier
    issueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
      description: Issue identifier

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller lacks the required role or signature
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with current state (e.g. duplicate application)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    Org:
      type: object
      required: [org_id, contract_address, created_at]
      properties:
        org_id:
          type: string
          example: org_stellar_001
        contract_address:
          type: string
          example: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM
        created_at:
          type: string
          format: date-time

    Issue:
      type: object
      required: [issue_id, org_id, title, status, created_at]
      properties:
        issue_id:
          type: string
          example: issue_42
        org_id:
          type: string
          example: org_stellar_001
        title:
          type: string
          example: Fix memory leak in sync service
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, assigned, completed]
        reward_xlm:
          type: number
          format: float
        created_at:
          type: string
          format: date-time

    Assignment:
      type: object
      required: [assignment_id, org_id, issue_id, contributor, assigned_at]
      properties:
        assignment_id:
          type: string
        org_id:
          type: string
        issue_id:
          type: string
        contributor:
          type: string
        assigned_at:
          type: string
          format: date-time

    Event:
      type: object
      required: [event_id, org_id, event_type, issue_id, contributor, tx_hash, occurred_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        event_type:
          type: string
          enum: [applied, withdrawn, assigned, completed, revoked]
        issue_id:
          type: string
        contributor:
          type: string
        tx_hash:
          type: string
        occurred_at:
          type: string
          format: date-time

    ApplyRequest:
      type: object
      required: [contributor]
      properties:
        contributor:
          type: string
          description: Stellar address of the contributor applying

    ApplicationEntry:
      type: object
      required: [contributor, issue_id, applied_at_ledger]
      properties:
        contributor:
          type: string
          description: Stellar address of the contributor
          example: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
        issue_id:
          type: integer
          description: Numeric issue identifier on-chain
          example: 42
        applied_at_ledger:
          type: integer
          description: Ledger sequence number when the application was submitted
          example: 1234567

    ApplicationsResponse:
      type: object
      required: [org_id, total, page, limit, applications]
      properties:
        org_id:
          type: string
          example: stellar-oss
        total:
          type: integer
          description: Total number of pending applications for the org
          example: 12
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationEntry'

    ApplyResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        tx_hash:
          type: string
        message:
          type: string

    ContributorStats:
      type: object
      required: [address, global_application_count, org_assignment_counts]
      properties:
        address:
          type: string
        global_application_count:
          type: integer
          minimum: 0
          maximum: 15
        org_assignment_counts:
          type: object
          additionalProperties:
            type: integer

    ContributorProfile:
      type: object
      required: [address, global_application_count, global_assignment_count, orgs, recent_events]
      properties:
        address:
          type: string
          description: Stellar public key of the contributor
          example: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
        global_application_count:
          type: integer
          minimum: 0
          description: Total pending applications across all organisations
        global_assignment_count:
          type: integer
          minimum: 0
          description: Total active assignments across all organisations
        orgs:
          type: array
          description: Per-organisation breakdown of applications and assignments
          items:
            $ref: '#/components/schemas/OrgBreakdown'
        recent_events:
          type: array
          description: Last 50 on-chain events for this contributor (newest first)
          items:
            $ref: '#/components/schemas/ContributorEvent'

    OrgBreakdown:
      type: object
      required: [org_id, applications, assignments]
      properties:
        org_id:
          type: string
        applications:
          type: integer
          minimum: 0
        assignments:
          type: integer
          minimum: 0

    ContributorEvent:
      type: object
      required: [id, event_type, tx_hash, ledger, timestamp]
      properties:
        id:
          type: integer
        event_type:
          type: string
          enum: [applied, withdrawn, assigned, completed, revoked, expired]
        org_id:
          type: string
          nullable: true
        issue_id:
          type: integer
          nullable: true
        tx_hash:
          type: string
        ledger:
          type: integer
        timestamp:
          type: string
          format: date-time

    AuditCancellationRecord:
      type: object
      required: [event_type, actor, contributor, org_id, issue_id, timestamp]
      properties:
        event_type:
          type: string
          enum: [revoked, expired, completed]
        actor:
          type: string
          description: Maintainer address who triggered the event
        contributor:
          type: string
          description: Contributor address affected
        org_id:
          type: string
        issue_id:
          type: integer
        reason:
          type: string
          description: Human-readable reason (may be empty)
        timestamp:
          type: string
          format: date-time
        tx_hash:
          type: string

    AuditPaginatedResult:
      type: object
      required: [data, total, page, pageSize, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditCancellationRecord'
        total:
          type: integer
          description: Total number of matching records
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    ConsistencyPair:
      type: object
      required: [contributor, org_id]
      properties:
        contributor:
          type: string
          description: Stellar address of the contributor
          example: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
        org_id:
          type: string
          description: Organisation identifier
          example: my_org

    ConsistencyResult:
      type: object
      required: [inconsistent_pairs, checked_at]
      properties:
        inconsistent_pairs:
          type: array
          description: Pairs where counter and sentinels disagree (empty = all consistent)
          items:
            $ref: '#/components/schemas/ConsistencyPair'
        checked_at:
          type: string
          format: date-time

    RemediateRequest:
      type: object
      required: [pairs, issue_ids]
      properties:
        pairs:
          type: array
          description: List of (contributor, org_id) pairs to remediate
          items:
            $ref: '#/components/schemas/ConsistencyPair'
        issue_ids:
          type: array
          description: Issue IDs to probe when rebuilding counters
          items:
            type: integer

    RemediateResponse:
      type: object
      required: [remediated, failed, summary]
      properties:
        remediated:
          type: array
          description: Pairs that were successfully corrected
          items:
            $ref: '#/components/schemas/ConsistencyPair'
        failed:
          type: array
          description: Pairs where remediation failed (with reason)
          items:
            type: object
            required: [pair, reason]
            properties:
              pair:
                $ref: '#/components/schemas/ConsistencyPair'
              reason:
                type: string
        summary:
          type: object
          required: [total, remediated_count, failed_count]
          properties:
            total:
              type: integer
            remediated_count:
              type: integer
            failed_count:
              type: integer

    VerifyXdrRequest:
      type: object
      required: [xdr]
      properties:
        xdr:
          type: string
          description: Base64-encoded signed Stellar XDR transaction envelope

    VerifyXdrResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: true when all verification checks pass
        signerAddress:
          type: string
          description: Contributor Stellar address extracted from the transaction (present when ok=true)
        contractId:
          type: string
          description: Contract ID targeted by the transaction (present when ok=true)
        reason:
          type: string
          description: Failure reason code (present when ok=false)
          enum:
            - MISSING_SIGNATURE
            - SIGNER_MISMATCH
            - TRANSACTION_EXPIRED
            - TRANSACTION_NOT_YET_VALID
            - WRONG_CONTRACT
            - MALFORMED_XDR
            - MISSING_CONTRIBUTOR_ARG
        detail:
          type: string
          description: Human-readable failure detail (present when ok=false)

    OrgCapResponse:
      type: object
      required: [org_id, cap]
      properties:
        org_id:
          type: string
          example: my_org
        cap:
          type: integer
          minimum: 1
          maximum: 20
          description: Current effective assignment cap for this org
          example: 4

    SetOrgCapRequest:
      type: object
      required: [maintainer_address, new_cap]
      properties:
        maintainer_address:
          type: string
          description: Registered maintainer Stellar address
        new_cap:
          type: integer
          minimum: 1
          maximum: 20
          description: New assignment cap value (1–20 inclusive)

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
