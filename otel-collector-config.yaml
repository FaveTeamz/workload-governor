receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  filter/healthcheck:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.target"] == "/ready"'
        - 'attributes["http.target"] == "/metrics"'
        - 'attributes["http.target"] == "/api/health"'
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.route"] == "/ready"'
        - 'attributes["http.route"] == "/metrics"'
        - 'attributes["http.route"] == "/api/health"'
        - 'name == "/health"'
        - 'name == "/ready"'
        - 'name == "/metrics"'
        - 'name == "/api/health"'
  tail_sampling:
    decision_wait: 5s
    num_traces: 10000
    expected_new_traces_per_sec: 1000
    policies:
      [
        {
          name: drop-health-checks,
          type: string_attribute,
          string_attribute: {
            key: http.target,
            values: ["/health", "/ready", "/metrics", "/api/health"],
            enabled_regex_matching: false,
            invert_match: true
          }
        },
        {
          name: error-policy,
          type: status_code,
          status_code: { status_codes: [ERROR] }
        },
        {
          name: probabilistic-policy,
          type: probabilistic,
          probabilistic: { sampling_percentage: 5.0 }
        }
      ]
  probabilistic_sampler:
    sampling_percentage: 5.0

exporters:
  debug:
    verbosity: detailed
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: workload_governor

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/healthcheck, tail_sampling, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
